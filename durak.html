<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Дурак онлайн</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at 50% 30%,#4a7ab5,#3a6396 60%,#2c4c74);color:#fff;user-select:none}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 22px;background:#ffb84d;color:#4a2b00;font-weight:700}
button:disabled{opacity:.45;cursor:default}
.screen{display:none;height:100%;flex-direction:column;align-items:center}
.screen.active{display:flex}
h1{margin:40px 0 8px;font-size:34px}
.sub{opacity:.8;margin-bottom:28px}
input{font:inherit;padding:12px 16px;border-radius:12px;border:0;width:180px;text-align:center;text-transform:uppercase}
#menu button{margin-top:14px;width:220px}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;gap:8px}
.code{font-size:22px;font-weight:700;letter-spacing:4px;background:rgba(0,0,0,.25);padding:6px 14px;border-radius:10px}
#conn{position:fixed;right:14px;bottom:14px;width:14px;height:14px;border-radius:50%;background:#e74c3c;z-index:20}
#conn.on{background:#2ecc71}
#oppName{font-weight:700}
#tableArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
#oppRow,#tableRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#tableRow{min-height:110px}
.card{width:64px;height:92px;border-radius:8px;background:#fff;color:#222;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card.red{color:#c0392b}
.card .s{font-size:26px}
.card.pick{outline:3px solid #ffd54f;cursor:pointer}
.stack{position:relative;width:64px;height:92px}
.stack .beat{position:absolute;left:14px;top:-10px;transform:rotate(8deg)}
.back{width:48px;height:68px;border-radius:6px;background:repeating-linear-gradient(45deg,#b03a2e,#b03a2e 6px,#7b241c 6px,#7b241c 12px);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#deckBox{position:absolute;left:16px;top:120px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
#bottom{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 10px 16px;width:100%}
#hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:96px}
#controls{display:flex;gap:10px;align-items:center}
#msg{min-height:22px;opacity:.9}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10}
#overlay.show{display:flex}
#winText{font-size:30px;font-weight:700}
</style>
</head>
<body>

<div id="conn" title="соединение"></div>

<div class="screen active" id="menuScreen">
  <h1>🂡 Дурак онлайн</h1>
  <div class="sub">Играй с другом по коду комнаты</div>
  <input id="nameInput" placeholder="Твоё имя" maxlength="12">
  <button onclick="createRoom()">Создать комнату</button>
  <input id="joinInput" placeholder="КОД КОМНАТЫ" maxlength="4">
  <button onclick="joinRoom()">Войти по коду</button>
</div>

<div class="screen" id="gameScreen">
  <div class="top">
    <button onclick="copyLink()" style="padding:8px 12px">🔗 Ссылка</button>
    <span class="code" id="codeText">----</span>
    <span id="oppName">Ожидание…</span>
  </div>
  <div id="tableArea">
    <div id="oppRow"></div>
    <div id="tableRow"></div>
    <div id="deckBox">
      <div class="back"></div>
      <div id="deckCount"></div>
    </div>
  </div>
  <div id="bottom">
    <div id="msg"></div>
    <div id="controls">
      <button id="btnBito" onclick="doBito()">Бито</button>
      <button id="btnTake" onclick="doTake()">Беру</button>
    </div>
    <div id="hand"></div>
  </div>
</div>

<div id="overlay">
  <div id="winText"></div>
  <button id="btnAgain" onclick="again()">Играть снова</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDEYtsO_tLkgVRvi6st4ZY0_xnyISirp8",
  authDomain: "durak-ac0df.firebaseapp.com",
  databaseURL: "https://durak-ac0df-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "durak-ac0df",
  storageBucket: "durak-ac0df.firebasestorage.app",
  messagingSenderId: "365166966595",
  appId: "1:365166966595:web:02a3bf27057537fb3e61f6",
  measurementId: "G-HLM6BQKH9N"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const RANKS=['6','7','8','9','10','J','Q','K','A'];
const SUITS=['♠','♥','♦','♣'];
const RI={}; RANKS.forEach((r,i)=>RI[r]=i);
const RED=s=>s==='♥'||s==='♦';
const $=id=>document.getElementById(id);

let me=localStorage.getItem('durak_pid');
if(!me){me='p'+Math.random().toString(36).slice(2,9);localStorage.setItem('durak_pid',me);}
let myName=localStorage.getItem('durak_name')||'Игрок';
let code=null,roomRef=null,stateRef=null;
let players={},st=null,myIdx=-1;

db.ref('.info/connected').on('value',s=>$('conn').classList.toggle('on',!!s.val()));

$('nameInput').value=myName;
$('nameInput').addEventListener('input',e=>{
  myName=e.target.value.trim()||'Игрок';
  localStorage.setItem('durak_name',myName);
});

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

function newGame(){
  const deck=[];
  SUITS.forEach(s=>RANKS.forEach(r=>deck.push({r,s})));
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  const trumpCard=deck[deck.length-1];
  const h0=deck.splice(0,6),h1=deck.splice(0,6);
  return {deck,trumpCard,hands:[h0,h1],table:[],turn:0,phase:'attack',discard:0,winner:null};
}

function createRoom(){
  code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  enterRoom(code);
}
function joinRoom(){
  const v=$('joinInput').value.trim().toUpperCase();
  if(v.length<4){alert('Введи код из 4 символов');return;}
  enterRoom(v);
}
function enterRoom(c){
  code=c;
  roomRef=db.ref('rooms/'+code);
  stateRef=roomRef.child('state');
  roomRef.child('players').transaction(cur=>{
    cur=cur||{};
    if((cur[0]&&cur[0].id===me)||(cur[1]&&cur[1].id===me))return cur;
    if(!cur[0])cur[0]={id:me,name:myName};
    else if(!cur[1])cur[1]={id:me,name:myName};
    else return;
    return cur;
  });
  roomRef.child('players').on('value',snap=>{
    players=snap.val()||{};
    stateRef.transaction(cur=>{
      if(cur||!players[0]||!players[1])return;
      return newGame();
    });
    render();
  });
  stateRef.on('value',snap=>{st=snap.val();render();});
  $('codeText').textContent=code;
  $('overlay').classList.remove('show');
  show('gameScreen');
}

function move(fn){
  if(!stateRef)return;
  stateRef.transaction(cur=>{
    if(!cur||cur.winner!=null)return;
    const res=fn(cur);
    return res===undefined?undefined:res;
  });
}

function beats(d,a,tr){
  if(d.s===a.s)return RI[d.r]>RI[a.r];
  return d.s===tr;
}
function canAttackWith(c,s){
  const def=1-s.turn;
  if(!s.table.length)return true;
  if(s.table.some(p=>!p.d))return false;
  if(s.table.length>=6||s.table.length>=(s.hands[def]||[]).length)return false;
  return s.table.some(p=>p.a.r===c.r||(p.d&&p.d.r===c.r));
}

function doAttack(card){
  move(s=>{
    if(s.phase!=='attack')return;
    const def=1-s.turn;
    const hand=s.hands[s.turn]||[];
    const i=hand.findIndex(c=>c.r===card.r&&c.s===card.s);
    if(i<0)return;
    if(!canAttackWith(card,s))return;
    hand.splice(i,1);
    s.table.push({a:card,d:null});
    return s;
  });
}
function doDefend(card,idx){
  move(s=>{
    if(s.phase!=='attack')return;
    const def=1-s.turn;
    const pair=(s.table||[])[idx];
    if(!pair||pair.d)return;
    if(!beats(card,pair.a,s.trumpCard.s))return;
    const hand=s.hands[def]=s.hands[def]||[];
    const i=hand.findIndex(c=>c.r===card.r&&c.s===card.s);
    if(i<0)return;
    hand.splice(i,1);
    pair.d=card;
    return s;
  });
}
function doTake(){
  move(s=>{
    if(s.phase!=='attack')return;
    const def=1-s.turn;
    s.table.forEach(p=>{
      (s.hands[def]=s.hands[def]||[]).push(p.a);
      if(p.d)(s.hands[def]=s.hands[def]||[]).push(p.d);
    });
    s.table=[];
    refill(s);checkWin(s);
    return s;
  });
}
function doBito(){
  move(s=>{
    if(s.phase!=='attack')return;
    if(!s.table.length||s.table.some(p=>!p.d))return;
    s.discard+=s.table.length*2;
    s.table=[];
    s.turn=1-s.turn;
    refill(s);checkWin(s);
    return s;
  });
}
function refill(s){
  [s.turn,1-s.turn].forEach(p=>{
    s.hands[p]=s.hands[p]||[];
    while(s.hands[p].length<6&&s.deck.length)s.hands[p].push(s.deck.shift());
  });
}
function checkWin(s){
  if(s.deck.length)return;
  const e0=!(s.hands[0]||[]).length,e1=!(s.hands[1]||[]).length;
  if(e0&&e1)s.winner=-1;
  else if(e0)s.winner=0;
  else if(e1)s.winner=1;
}
function again(){
  stateRef.transaction(cur=>{
    if(cur&&cur.winner==null)return;
    return newGame();
  });
  $('overlay').classList.remove('show');
}

$('hand').addEventListener('click',e=>{
  const el=e.target.closest('.card');
  if(!el||!st||st.winner!=null||myIdx<0)return;
  const card=(st.hands[myIdx]||[])[+el.dataset.i];
  if(!card)return;
  if(myIdx===st.turn){doAttack(card);return;}
  const idx=(st.table||[]).findIndex(p=>!p.d);
  if(idx>=0&&beats(card,st.table[idx].a,st.trumpCard.s))doDefend(card,idx);
});

function copyLink(){
  const url=location.href.split('?')[0]+'?room='+code;
  navigator.clipboard.writeText(url).then(()=>alert('Ссылка скопирована!'));
}

function cardHTML(c,pick,extra){
  return `<div class="card ${RED(c.s)?'red':''} ${pick?'pick':''} ${extra||''}" ${pick?'':''}>${c.r}<span class="s">${c.s}</span></div>`;
}

function render(){
  if(code)$('codeText').textContent=code;
  myIdx=(players[0]&&players[0].id===me)?0:((players[1]&&players[1].id===me)?1:-1);
  const opp=players[1-myIdx];
  $('oppName').textContent=opp?('Противник: '+opp.name):'Ожидание второго игрока…';
  $('btnBito').style.display='none';
  $('btnTake').style.display='none';
  $('oppRow').innerHTML='';
  $('tableRow').innerHTML='';
  $('hand').innerHTML='';
  if(!st){$('msg').textContent=myIdx<0?'Не удалось подключиться':'Ждём второго игрока…';return;}

  $('deckCount').textContent='Колода: '+(st.deck||[]).length+' · Козырь: '+st.trumpCard.s;
  $('oppRow').innerHTML=((st.hands[1-myIdx]||[]).map(()=>'<div class="back"></div>').join(''))||'';

  $('tableRow').innerHTML=(st.table||[]).map(p=>
    `<div class="stack">${cardHTML(p.a,false)}${p.d?cardHTML(p.d,false,'beat'):''}</div>`
  ).join('');

  const my=st.hands[myIdx]||[];
  const isAtt=myIdx===st.turn,isDef=myIdx===1-st.turn;
  $('hand').innerHTML=my.map((c,i)=>{
    let pick=false;
    if(st.winner==null){
      if(isAtt)pick=canAttackWith(c,st);
      if(isDef)pick=(st.table||[]).some((p,j)=>!p.d&&beats(c,p.a,st.trumpCard.s));
    }
    return `<div class="card ${RED(c.s)?'red':''} ${pick?'pick':''}" data-i="${i}">${c.r}<span class="s">${c.s}</span></div>`;
  }).join('');

  if(isAtt){
    $('btnBito').style.display='';
    $('btnBito').disabled=!(st.table||[]).length||(st.table||[]).some(p=>!p.d);
  }
  if(isDef){
    $('btnTake').style.display='';
    $('btnTake').disabled=false;
  }

  if(myIdx<0){$('msg').textContent='Ты наблюдатель';}
  else if(st.winner!=null){$('msg').textContent='Игра окончена';}
  else if(isAtt){$('msg').textContent='Твой ход — атакуй или нажми «Бито»';}
  else if(isDef){$('msg').textContent='Защищайся: бей карту или жми «Беру»';}
  else $('msg').textContent='Ход противника…';

  if(st.winner!=null){
    $('overlay').classList.add('show');
    $('winText').textContent=st.winner===-1?'Ничья!':(st.winner===myIdx?'Ты выиграл! 🎉':'Ты проиграл :(');
  }else{
    $('overlay').classList.remove('show');
  }
}

const rc=new URL(location.href).searchParams.get('room');
if(rc)enterRoom(rc.toUpperCase());
</script>
</body>
</html>
